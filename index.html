<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noesis Project Terminal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<!--  
Sir, we found something in his file. A document with "7-e4N9" written on it.  
That’s the second one we’ve found so far with this pattern.  
Hmm. Confiscate and redact that file right now. And start a log about these ASAP, he is up to something.

God fu-

<body>
    <div class="background">
        <button id="powerButton"></button>

        <div class="monitor">
            <!-- Video element that starts with Monster_Corp_2.webm -->
            <video id="monitorVideo" width="100%" height="100%" autoplay muted>
                <source id="videoSource" src="Monster_Corp_2.webm" type="video/webm">
                Your browser does not support the video tag.
            </video>
            <div class="screen" id="screen">
                <p id="output"></p>
                <div id="redX">✖</div>
            </div>
        </div>

        <!-- Input box is now outside the monitor -->
        <input type="text" id="commandInput" placeholder="" disabled>
    </div>

    <!-- Audio Elements -->
    <audio id="errorSound" src="buzzer.mp3"></audio>
    <audio id="correctSound" src="correct.mp3"></audio>
    <audio id="bgMusic" src="background.mp3" loop></audio>
    <audio id="paperSound" src="paper.mp3"></audio>
</body>
</html>
